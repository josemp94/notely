services:
  db:
    image: postgres:16-alpine
    container_name: notiono-db
    environment:
      POSTGRES_USER: notely
      POSTGRES_PASSWORD: notely
      POSTGRES_DB: notely
    expose:
      - "5432"
    volumes:
      - notely-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notely"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: build
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    environment:
      DATABASE_URL: "postgresql://notely:notely@db:5432/notely"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  collab:
    # Servidor de edición simultánea (Yjs sobre WebSocket). Usa la etapa de build,
    # que ya trae node_modules y el cliente de Prisma generado.
    build:
      context: .
      target: build
    container_name: notiono-collab
    command: sh -c "npx tsx collab/server.ts"
    environment:
      DATABASE_URL: "postgresql://notely:notely@db:5432/notely"
      COLLAB_PORT: "1234"
      # Debe ser el MISMO valor que usa la app: con él se firman y validan los
      # permisos de sala. Si no coincide, nadie puede entrar a editar.
      AUTH_SECRET: "dev-secret-cambiar-en-prod"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "1234"
    ports:
      - "3011:1234"
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        # Debe apuntar al proxy inverso del DSM que expone el WebSocket.
        NEXT_PUBLIC_COLLAB_URL: "wss://notiono.monrealperez.com/collab"
    container_name: notiono-app
    command: ["node", "server.js"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgresql://notely:notely@db:5432/notely"
      AUTH_SECRET: "dev-secret-cambiar-en-prod"
      NODE_ENV: "production"
      OIDC_ISSUER: "https://monrealperez.com/sso/webman/sso"
      OIDC_CLIENT_ID: "aaffef367517843c60a650c711c87010"
      OIDC_CLIENT_SECRET: "2ZAb6KOLZ9A6LnpbGqCMCsc2SEBnUJtl"
      OIDC_REDIRECT_URI: "https://notiono.monrealperez.com/api/auth/oidc/callback"
      OIDC_PROVIDER_NAME: "Synology"
    ports:
      - "3010:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  notely-db-data:
