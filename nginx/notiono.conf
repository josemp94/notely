# Proxy de Notiono: un solo puerto para la web y la edición simultánea, para que
# todo viva en el mismo dominio (notiono.monrealperez.com) y el proxy inverso del
# DSM solo tenga que apuntar a un sitio.
server {
    listen 80;
    server_name _;

    # Las portadas se suben por aquí (hasta 8 MB en la app): sin esto nginx
    # cortaría en 1 MB y la subida fallaría.
    client_max_body_size 16m;

    # Edición simultánea (WebSocket). El nombre del documento viaja dentro del
    # protocolo, no en la ruta, así que no hace falta reescribir nada.
    location /collab {
        proxy_pass http://collab:1234;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Una sesión de edición puede estar horas sin enviar nada.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
